<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Inter, -apple-system, 'PingFang SC', system-ui, sans-serif">
  <title>ai-space Space preset: light and dark sketch</title>
  <desc>Proposed Space preset (docs/design-guidelines.md). Each half shows the field with the orbital arc, three launcher tiles (one focused), a widget card with a hero value and a stale time, and a reading panel with a primary and a secondary button.</desc>
  <defs>
    <clipPath id="L"><rect x="0" y="0" width="600" height="560"/></clipPath>
    <clipPath id="D"><rect x="600" y="0" width="600" height="560"/></clipPath>
    <radialGradient id="arcL" cx="760" cy="-200" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0.80" stop-color="#a5f0f7" stop-opacity="0"/>
      <stop offset="0.86" stop-color="#a5f0f7" stop-opacity="0.45"/>
      <stop offset="0.895" stop-color="#b9e4ff" stop-opacity="1"/>
      <stop offset="0.905" stop-color="#b9e4ff" stop-opacity="0.9"/>
      <stop offset="0.95" stop-color="#ddd3fd" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ddd3fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="arcD" cx="1360" cy="-200" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0.80" stop-color="#0c4a54" stop-opacity="0"/>
      <stop offset="0.86" stop-color="#0c4a54" stop-opacity="0.6"/>
      <stop offset="0.895" stop-color="#1d6fa8" stop-opacity="1"/>
      <stop offset="0.905" stop-color="#0f3a5e" stop-opacity="0.95"/>
      <stop offset="0.95" stop-color="#2a2463" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2a2463" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#103460" flood-opacity="0.09"/></filter>
    <filter id="shD" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>

  <!-- Light -->
  <g clip-path="url(#L)">
    <rect width="600" height="560" fill="#f3f7fc"/>
    <rect width="600" height="560" fill="url(#arcL)"/>
    <text x="32" y="44" font-size="12" font-weight="600" fill="#0b1324" fill-opacity="0.66" letter-spacing="0.5">LIGHT · SPACE (PROPOSED)</text>
    <text x="32" y="88" font-size="22" font-weight="700" fill="#0b1324" letter-spacing="-0.4">Apps</text>
    <g filter="url(#sh)">
      <rect x="32" y="108" width="64" height="64" rx="14" fill="#ffffff" fill-opacity="0.62" stroke="#ffffff" stroke-opacity="0.72"/>
      <rect x="148" y="108" width="64" height="64" rx="14" fill="#ffffff"/>
      <rect x="264" y="108" width="64" height="64" rx="14" fill="#ffffff" fill-opacity="0.62" stroke="#ffffff" stroke-opacity="0.72"/>
    </g>
    <text x="64" y="150" font-size="30" text-anchor="middle">✅</text>
    <text x="180" y="150" font-size="30" text-anchor="middle">📈</text>
    <text x="296" y="150" font-size="30" text-anchor="middle">📝</text>
    <rect x="261" y="105" width="70" height="70" rx="16" fill="none" stroke="#0a66c2" stroke-width="3"/>
    <rect x="312" y="100" width="22" height="20" rx="10" fill="#c62828"/>
    <text x="323" y="114" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="64" y="192" font-size="13" fill="#0b1324" text-anchor="middle">Todo</text>
    <text x="180" y="192" font-size="13" fill="#0b1324" text-anchor="middle">Portfolio</text>
    <text x="296" y="192" font-size="13" fill="#0b1324" text-anchor="middle">Notes</text>
    <text x="32" y="218" font-size="11" fill="#0b1324" fill-opacity="0.66">focus ring 3 px · badge = danger + number</text>

    <!-- widget -->
    <g filter="url(#sh)"><rect x="32" y="240" width="250" height="150" rx="16" fill="#ffffff" fill-opacity="0.62" stroke="#ffffff" stroke-opacity="0.72"/></g>
    <line x1="48" y1="241" x2="266" y2="241" stroke="#ffffff" stroke-opacity="0.9"/>
    <text x="48" y="268" font-size="13" font-weight="600" fill="#0b1324" fill-opacity="0.66">Portfolio</text>
    <text x="266" y="268" font-size="11" font-weight="600" fill="#9a5b00" text-anchor="end">2 h ago · stale</text>
    <text x="48" y="292" font-size="12" fill="#0b1324" fill-opacity="0.66">Net value</text>
    <text x="48" y="336" font-size="40" font-weight="650" fill="#0b1324" letter-spacing="-0.8">$84,210</text>
    <circle cx="52" cy="366" r="4" fill="#1a7f37"/>
    <text x="62" y="370" font-size="12" font-weight="600" fill="#1a7f37">+1.8% today</text>

    <!-- reading panel -->
    <g filter="url(#sh)"><rect x="306" y="240" width="262" height="290" rx="16" fill="#fbfdff" fill-opacity="0.96" stroke="#ffffff" stroke-opacity="0.72"/></g>
    <text x="322" y="268" font-size="15" font-weight="600" fill="#0b1324">Settings</text>
    <line x1="306" y1="282" x2="568" y2="282" stroke="#0b1324" stroke-opacity="0.09"/>
    <text x="322" y="306" font-size="11" font-weight="600" fill="#0b1324" fill-opacity="0.66" letter-spacing="0.4">APPEARANCE</text>
    <text x="322" y="334" font-size="13" fill="#0b1324">Theme</text>
    <rect x="482" y="320" width="70" height="22" rx="11" fill="#ffffff" fill-opacity="0.62" stroke="#0b1324" stroke-opacity="0.12"/>
    <text x="517" y="335" font-size="12" fill="#0b1324" text-anchor="middle">Space ▾</text>
    <text x="322" y="368" font-size="13" fill="#0b1324">Glow</text>
    <rect x="512" y="354" width="40" height="24" rx="12" fill="#0a66c2"/>
    <circle cx="540" cy="366" r="10" fill="#ffffff"/>
    <text x="322" y="402" font-size="13" fill="#0b1324">Link color</text>
    <text x="552" y="402" font-size="13" fill="#0a5fb4" text-anchor="end">Learn more</text>
    <text x="322" y="440" font-size="12" fill="#0b1324" fill-opacity="0.66">Secondary text 5.9:1 on panel</text>
    <rect x="374" y="480" width="82" height="34" rx="17" fill="#ffffff" fill-opacity="0.62" stroke="#0b1324" stroke-opacity="0.12"/>
    <text x="415" y="502" font-size="14" fill="#0b1324" text-anchor="middle">Cancel</text>
    <rect x="466" y="480" width="86" height="34" rx="17" fill="#0b1324"/>
    <text x="509" y="502" font-size="14" fill="#ffffff" text-anchor="middle">Save</text>
  </g>

  <!-- Dark -->
  <g clip-path="url(#D)">
    <rect x="600" width="600" height="560" fill="#0c1322"/>
    <rect x="600" width="600" height="560" fill="url(#arcD)"/>
    <text x="632" y="44" font-size="12" font-weight="600" fill="#e2ebf8" fill-opacity="0.68" letter-spacing="0.5">DARK · SPACE (PROPOSED)</text>
    <text x="632" y="88" font-size="22" font-weight="700" fill="#edf3fb" letter-spacing="-0.4">Apps</text>
    <g filter="url(#shD)">
      <rect x="632" y="108" width="64" height="64" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#badeff" stroke-opacity="0.16"/>
      <rect x="748" y="108" width="64" height="64" rx="14" fill="#1a2439"/>
      <rect x="864" y="108" width="64" height="64" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#badeff" stroke-opacity="0.16"/>
    </g>
    <text x="664" y="150" font-size="30" text-anchor="middle">✅</text>
    <text x="780" y="150" font-size="30" text-anchor="middle">📈</text>
    <text x="896" y="150" font-size="30" text-anchor="middle">📝</text>
    <rect x="861" y="105" width="70" height="70" rx="16" fill="none" stroke="#7cc6ff" stroke-width="3"/>
    <rect x="912" y="100" width="22" height="20" rx="10" fill="#f87171"/>
    <text x="923" y="114" font-size="11" font-weight="700" fill="#04121f" text-anchor="middle">3</text>
    <text x="664" y="192" font-size="13" fill="#edf3fb" text-anchor="middle">Todo</text>
    <text x="780" y="192" font-size="13" fill="#edf3fb" text-anchor="middle">Portfolio</text>
    <text x="896" y="192" font-size="13" fill="#edf3fb" text-anchor="middle">Notes</text>
    <text x="632" y="218" font-size="11" fill="#e2ebf8" fill-opacity="0.68">same geometry; only tokens change</text>

    <g filter="url(#shD)"><rect x="632" y="240" width="250" height="150" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#badeff" stroke-opacity="0.16"/></g>
    <line x1="648" y1="241" x2="866" y2="241" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="648" y="268" font-size="13" font-weight="600" fill="#e2ebf8" fill-opacity="0.68">Portfolio</text>
    <text x="866" y="268" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="end">2 h ago · stale</text>
    <text x="648" y="292" font-size="12" fill="#e2ebf8" fill-opacity="0.68">Net value</text>
    <text x="648" y="336" font-size="40" font-weight="650" fill="#edf3fb" letter-spacing="-0.8">$84,210</text>
    <circle cx="652" cy="366" r="4" fill="#4ade80"/>
    <text x="662" y="370" font-size="12" font-weight="600" fill="#4ade80">+1.8% today</text>

    <g filter="url(#shD)"><rect x="906" y="240" width="262" height="290" rx="16" fill="#111a2c" fill-opacity="0.97" stroke="#badeff" stroke-opacity="0.16"/></g>
    <text x="922" y="268" font-size="15" font-weight="600" fill="#edf3fb">Settings</text>
    <line x1="906" y1="282" x2="1168" y2="282" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="922" y="306" font-size="11" font-weight="600" fill="#e2ebf8" fill-opacity="0.68" letter-spacing="0.4">APPEARANCE</text>
    <text x="922" y="334" font-size="13" fill="#edf3fb">Theme</text>
    <rect x="1082" y="320" width="70" height="22" rx="11" fill="#ffffff" fill-opacity="0.07" stroke="#badeff" stroke-opacity="0.2"/>
    <text x="1117" y="335" font-size="12" fill="#edf3fb" text-anchor="middle">Space ▾</text>
    <text x="922" y="368" font-size="13" fill="#edf3fb">Glow</text>
    <rect x="1112" y="354" width="40" height="24" rx="12" fill="#5ab8ff"/>
    <circle cx="1140" cy="366" r="10" fill="#04121f"/>
    <text x="922" y="402" font-size="13" fill="#edf3fb">Link color</text>
    <text x="1152" y="402" font-size="13" fill="#7cc6ff" text-anchor="end">Learn more</text>
    <text x="922" y="440" font-size="12" fill="#e2ebf8" fill-opacity="0.68">Secondary text 7.2:1 on panel</text>
    <rect x="974" y="480" width="82" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#badeff" stroke-opacity="0.2"/>
    <text x="1015" y="502" font-size="14" fill="#edf3fb" text-anchor="middle">Cancel</text>
    <rect x="1066" y="480" width="86" height="34" rx="17" fill="#edf3fb"/>
    <text x="1109" y="502" font-size="14" fill="#0c1322" text-anchor="middle">Save</text>
  </g>
</svg>
