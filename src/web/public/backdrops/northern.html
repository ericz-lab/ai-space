<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northern Lights</title>
<!-- A panel backdrop (docs/panel.md#appearance): static artwork the panel frames behind the page.
     data-theme on <html> picks the light or dark version; the framing page sets it. -->
<script>
(function () {
  var e = document.documentElement, t;
  try { t = parent.document.documentElement.dataset.theme; } catch (_) {}
  if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  e.dataset.theme = t;
})();
</script>
<style>

:root{
  /* light: pearlescent veils on a pale ground */
  --ground:#f3f1fa;
  --mesh:
    radial-gradient(60% 55% at 12% 8%, #ffd9ec 0%, transparent 70%),
    radial-gradient(55% 60% at 88% 12%, #cfe6ff 0%, transparent 70%),
    radial-gradient(50% 45% at 55% 38%, #e3dcff 0%, transparent 72%),
    radial-gradient(60% 50% at 20% 78%, #d2f7ea 0%, transparent 70%),
    radial-gradient(60% 55% at 85% 88%, #ffe6d2 0%, transparent 70%),
    linear-gradient(180deg,#f1eefb 0%,#f7f5fb 55%,#fbf7f4 100%);
  --blend:multiply; --curtain-op:1; --stars:0; --bloom:.45;
  --a0:#00a07c; --a1:#12c598; --a2:#5fe0be; --a3:#8fdcf2; --a4:#b9c4ff; --a5:#e4b8ff;
  --b0:#0b84d6; --b1:#2fa6ec; --b2:#7cc9fa; --b3:#a9bdff; --b4:#cdb4ff; --b5:#ffbfe6;
  --c0:#8b3ff0; --c1:#aa6cf6; --c2:#cba0fb; --c3:#f3b4ea; --c4:#ffc3d2; --c5:#ffd9b8;
  --hem-a:#00a07c; --hem-b:#0b84d6; --hem-c:#8b3ff0; --hem-op:.55;
  --glow-a:#34d9ae; --glow-b:#58bdf5; --glow-c:#c08af8; --glow-op:.45; --glow-blend:multiply;
  --grain-op:.5; --grain-blend:soft-light;
  --vig:radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(120,100,180,.10) 100%);
  --text:#1c1b2e; --text-shadow:0 0 6px rgba(255,255,255,.95),0 1px 2px rgba(255,255,255,.9);
  --glass:rgba(255,255,255,.46); --glass-b:rgba(255,255,255,.75); --muted:rgba(28,27,46,.62);
}
html[data-theme=dark]{
  --ground:#040816;
  --mesh:
    radial-gradient(60% 50% at 14% 10%, #1a1458 0%, transparent 70%),
    radial-gradient(55% 55% at 86% 6%, #0a2f5c 0%, transparent 72%),
    radial-gradient(50% 40% at 52% 44%, #06363f 0%, transparent 72%),
    radial-gradient(70% 40% at 40% 84%, #06303a 0%, transparent 72%),
    radial-gradient(60% 45% at 88% 92%, #1d0f44 0%, transparent 70%),
    linear-gradient(180deg,#040716 0%,#050b1e 55%,#03060f 100%);
  --blend:screen; --curtain-op:1; --stars:1; --bloom:.7;
  --a0:#c9ffe0; --a1:#4dffa6; --a2:#16e08c; --a3:#0fb5a0; --a4:#2a7de0; --a5:#7a4df0;
  --b0:#cdf8ff; --b1:#5fe4ff; --b2:#22b6f0; --b3:#3f7df2; --b4:#7a54ee; --b5:#c044d8;
  --c0:#ffd0f6; --c1:#e874ff; --c2:#a94df2; --c3:#6d3fe6; --c4:#c23fb4; --c5:#ff4f8f;
  --hem-a:#d6ffe6; --hem-b:#d2f9ff; --hem-c:#ffd6f7; --hem-op:.85;
  --glow-a:#3dffa6; --glow-b:#4fd8ff; --glow-c:#d86bff; --glow-op:.55; --glow-blend:screen;
  --grain-op:.42; --grain-blend:overlay;
  --vig:radial-gradient(120% 95% at 50% 42%, transparent 50%, rgba(0,0,8,.55) 100%);
  --text:#fff; --text-shadow:0 1px 3px rgba(0,0,0,.75),0 0 10px rgba(0,0,0,.45);
  --glass:rgba(16,22,44,.38); --glass-b:rgba(255,255,255,.16); --muted:rgba(255,255,255,.7);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;color:var(--text);background:var(--ground);overflow:hidden}
.bg{position:fixed;inset:0;background:var(--mesh);overflow:hidden;isolation:isolate}
.sky{position:absolute;inset:0;width:100%;height:100%;display:block}
.sky-P{display:none}
@media (max-aspect-ratio: 1/1){.sky-L{display:none}.sky-P{display:block}}
.stars{fill:#fff;opacity:var(--stars)}
.curtain{mix-blend-mode:var(--blend);opacity:var(--curtain-op)}
.bloom{opacity:var(--bloom)}
.hem{fill:none;stroke-width:2.4;stroke-linecap:butt;stroke-linejoin:round;opacity:var(--hem-op)}
.hem-glow{fill:none;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;opacity:var(--glow-op);mix-blend-mode:var(--glow-blend)}
.hm-a{stroke:var(--hem-a)}.hm-b{stroke:var(--hem-b)}.hm-c{stroke:var(--hem-c)}
.hg-a{stroke:var(--glow-a)}.hg-b{stroke:var(--glow-b)}.hg-c{stroke:var(--glow-c)}
.s-a0{stop-color:var(--a0)}.s-a1{stop-color:var(--a1)}.s-a2{stop-color:var(--a2)}.s-a3{stop-color:var(--a3)}.s-a4{stop-color:var(--a4)}.s-a5{stop-color:var(--a5)}
.s-b0{stop-color:var(--b0)}.s-b1{stop-color:var(--b1)}.s-b2{stop-color:var(--b2)}.s-b3{stop-color:var(--b3)}.s-b4{stop-color:var(--b4)}.s-b5{stop-color:var(--b5)}
.s-c0{stop-color:var(--c0)}.s-c1{stop-color:var(--c1)}.s-c2{stop-color:var(--c2)}.s-c3{stop-color:var(--c3)}.s-c4{stop-color:var(--c4)}.s-c5{stop-color:var(--c5)}
.vig{position:absolute;inset:0;background:var(--vig);pointer-events:none}
.grain{position:absolute;inset:0;width:100%;height:100%;opacity:var(--grain-op);mix-blend-mode:var(--grain-blend);pointer-events:none}
</style>
</head>
