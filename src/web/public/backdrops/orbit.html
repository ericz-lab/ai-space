<!-- A panel backdrop (docs/panel.md#appearance): static artwork the panel frames behind the page.
     data-theme on <html> picks the light or dark version; the framing page sets it. -->
<script>
(function () {
  var e = document.documentElement, t;
  try { t = parent.document.documentElement.dataset.theme; } catch (_) {}
  if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  e.dataset.theme = t;
})();
</script>

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg1); color: var(--fg); font: 13px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
.bg { position: fixed; inset: 0; overflow: hidden; }
.bg svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bg .tall { display: none; }
@media (max-aspect-ratio: 1/1) { .bg .wide { display: none; } .bg .tall { display: block; } }
.sn { fill: var(--star); color: var(--star); } .sc { fill: var(--star-c); color: var(--star-c); } .sw { fill: var(--star-w); color: var(--star-w); }
.stars { opacity: var(--star-op); }
.band { opacity: var(--band-op); }
.halo { opacity: var(--halo-op); }
.grain { opacity: var(--grain-op); mix-blend-mode: soft-light; }
.body .core { fill: var(--bcore); }
.body.warm .core { fill: var(--bwarm); }
