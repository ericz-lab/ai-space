<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c31"/><stop offset="1" stop-color="#0b0b0e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#34d399" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <!-- A prompt: chevron and cursor block. -->
  <g filter="url(#glow)">
    <polyline points="15,21 27,32 15,43" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="32" y="38" width="17" height="5" rx="1.5" fill="#e5e7eb"/>
  </g>
</svg>
