# XcodeGen spec for AISpace.xcodeproj; run `bun run desktop:xcode` after adding or moving files
# (it fetches SwiftTerm first).
# scripts/build.sh and scripts/test.sh build the same sources with swiftc and need no Xcode.
name: AISpace
options:
  bundleIdPrefix: dev.ai-space
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  # The terminal emulator behind the Terminal page, from the sources scripts/fetch-deps.sh fetches
  # at the release the iPhone client pins (mobile/ios/scripts/swiftterm.sh says why not a package).
  SwiftTerm:
    type: library.static
    platform: macOS
    sources:
      - path: build/deps/SwiftTerm/Sources/SwiftTerm
        excludes: ["**/*.metal", "**/*.md", "Documentation.docc"]
    settings:
      base:
        PRODUCT_NAME: SwiftTerm
        SWIFT_SUPPRESS_WARNINGS: YES
        SKIP_INSTALL: YES
  AISpace:
    type: application
    platform: macOS
    sources:
      - path: AISpace
        excludes: [Info.plist, AISpace.entitlements, Resources/AppIcon.svg]
      # The iPhone client's Foundation-only code, compiled from where it lives
      # (scripts/sources.sh lists the same files).
      - path: ../../mobile/ios/AISpace/Core/Catalogue.swift
        group: Shared
      - path: ../../mobile/ios/AISpace/Core/CatalogueCache.swift
        group: Shared
      - path: ../../mobile/ios/AISpace/Core/CatalogueSearch.swift
        group: Shared
      - path: ../../mobile/ios/AISpace/Core/HubModels.swift
        group: Shared
      - path: ../../mobile/ios/AISpace/Core/IconSource.swift
        group: Shared
      - path: ../../mobile/ios/AISpace/Core/Screens.swift
        group: Shared
      - path: ../../mobile/ios/AISpace/Core/ScreenStore.swift
        group: Shared
      - path: ../../mobile/ios/AISpace/Core/SpaceSettings.swift
        group: Shared
      - path: ../../mobile/ios/AISpace/Core/TerminalModels.swift
        group: Shared
      - path: ../../mobile/ios/AISpace/Core/WidgetBlocks.swift
        group: Shared
      - path: ../../mobile/ios/AISpace/Live/CatalogueLoader.swift
        group: Shared
      - path: ../../mobile/ios/AISpace/Live/SettingsLoader.swift
        group: Shared
      - path: ../../mobile/ios/AISpace/Live/HubStores.swift
        group: Shared
      - path: ../../mobile/ios/AISpace/Live/TerminalSession.swift
        group: Shared
      - path: ../../mobile/ios/AISpace/Live/TerminalStore.swift
        group: Shared
    dependencies:
      - target: SwiftTerm
    settings:
      base:
        PRODUCT_NAME: AISpace
        PRODUCT_BUNDLE_IDENTIFIER: dev.ai-space.desktop
        INFOPLIST_FILE: AISpace/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: AISpace/AISpace.entitlements
        CODE_SIGN_STYLE: Automatic
  AISpaceTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AISpaceTests]
    dependencies:
      - target: AISpace
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AISpace.app/Contents/MacOS/AISpace
schemes:
  AISpace:
    build:
      targets:
        AISpace: all
        AISpaceTests: [test]
    test:
      targets: [AISpaceTests]
