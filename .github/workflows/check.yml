# The checks every change must pass (AGENTS.md#validation), and the native clients' tests and build.
# Also called by release.yml before anything is packaged.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bun:
    name: typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  android:
    name: Android client
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: mobile/android/**/*.gradle.kts
      # The runner image carries the Android SDK; Gradle fetches platform 36 if it is missing.
      - run: ./gradlew --no-daemon :app:testDebugUnitTest
        working-directory: mobile/android

  windows:
    name: Windows client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # WPF builds on Linux with EnableWindowsTargeting; running it needs Windows.
      - run: dotnet test desktop/windows/Core.Tests
      - run: dotnet build desktop/windows/App

  native:
    name: Mac and iPhone clients
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: desktop/macos/scripts/test.sh
      - run: mobile/ios/scripts/test.sh
      - run: CONFIG=release desktop/macos/scripts/build.sh
