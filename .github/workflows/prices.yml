name: prices

# Publish ai-space's price catalogue (docs/prices.md#publishing): every Space fetches
# https://bucket.ai-space.me/prices/v1.json once a day, so a price merged here reaches every install,
# old releases included, within a day, with no release and no deploy.
#
#   1. build the catalogue from src/space/prices/tables and check it as a Space would (bun run prices build);
#   2. report what it changes against the published one (bun run prices check), in the run's summary;
#   3. upload it to the bucket under prices/v1.json, and keep a dated copy under prices/v1/<asOf>.json.
#
# Off until the repository variable PRICES_PUBLISH is "on" (Settings → Secrets and variables →
# Actions → Variables). Secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY: an R2 token
# that may write objects in the bucket and nothing else (the one ai-space-apps' store-release uses
# will do). Variable: R2_BUCKET (default ai-space-store).

on:
  push:
    branches: [main]
    paths: ["src/space/prices/tables/**", "src/space/prices/catalogue.ts", "scripts/prices.ts"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency: prices-publish

jobs:
  publish:
    if: vars.PRICES_PUBLISH == 'on'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ vars.R2_BUCKET || 'ai-space-store' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - name: Build and check the catalogue
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || { echo "set the R2_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY secrets"; exit 1; }
          bun run prices build dist/prices/v1.json
          bun run prices check --report "$RUNNER_TEMP/report.md" || true
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload it
        run: |
          as_of=$(bun -e "console.log((await Bun.file('dist/prices/v1.json').json()).asOf.slice(0, 10))")
          aws s3 cp dist/prices/v1.json "s3://$R2_BUCKET/prices/v1/$as_of.json" --endpoint-url "$R2_ENDPOINT" --only-show-errors \
            --content-type application/json --cache-control "public, max-age=3600"
          aws s3 cp dist/prices/v1.json "s3://$R2_BUCKET/prices/v1.json" --endpoint-url "$R2_ENDPOINT" --only-show-errors \
            --content-type application/json --cache-control "public, max-age=300"
          echo "published prices/v1.json of $as_of" >> "$GITHUB_STEP_SUMMARY"
