# XcodeGen spec for AISpace.xcodeproj; run `bun run ios:xcode` after adding or moving files.
# The iPhone and Simulator builds need Xcode (`xcodebuild`, see README.md). scripts/test.sh and
# scripts/build.sh need only the Command Line Tools: the tests run on the Mac, and the app
# builds for Mac Catalyst from the same sources.
name: AISpace
options:
  bundleIdPrefix: dev.ai-space
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
# Config/Signing.xcconfig pulls in the git-ignored Local.xcconfig, where each machine sets its own
# DEVELOPMENT_TEAM; the targets leave the team unset so that value reaches them.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  # The terminal emulator behind the Terminal page, from the sources scripts/swiftterm.sh fetches
  # at its pinned release (`bun run ios:xcode` runs it first; that script says why not a package).
  SwiftTerm:
    type: library.static
    platform: iOS
    sources:
      - path: build/deps/SwiftTerm/Sources/SwiftTerm
        excludes: ["**/*.metal", "**/*.md", "Documentation.docc"]
    settings:
      base:
        PRODUCT_NAME: SwiftTerm
        SWIFT_SUPPRESS_WARNINGS: YES
        SKIP_INSTALL: YES
  AISpace:
    type: application
    platform: iOS
    sources:
      - path: AISpace
        excludes: [Info.plist, AISpace.entitlements]
      # Foundation-only code shared with the Mac client, compiled from where it lives
      # (scripts/sources.sh lists the same files).
      - path: ../../desktop/macos/AISpace/Services/Connection.swift
        group: Shared
      - path: ../../desktop/macos/AISpace/Services/ConnectionStore.swift
        group: Shared
      - path: ../../desktop/macos/AISpace/Services/SpaceCheck.swift
        group: Shared
      - path: ../../desktop/macos/AISpace/Services/SpaceAPI.swift
        group: Shared
      - path: ../../desktop/macos/AISpace/Services/SpaceModels.swift
        group: Shared
      - path: ../../desktop/macos/AISpace/Services/OmniboxRules.swift
        group: Shared
      - path: ../../desktop/macos/AISpace/Services/ChatImage.swift
        group: Shared
      - path: ../../desktop/macos/AISpace/Services/ChatMarkdown.swift
        group: Shared
      - path: ../../desktop/macos/AISpace/Services/ChatStream.swift
        group: Shared
      - path: ../../desktop/macos/AISpace/Services/DesktopRules.swift
        group: Shared
      - path: ../../desktop/macos/AISpace/Web/NavigationPolicy.swift
        group: Shared
      - path: ../../desktop/macos/AISpace/Web/WebCookieSession.swift
        group: Shared
      # The desk pet's rules and its sheet, the panel's own.
      - path: ../../desktop/macos/AISpace/Services/PetRules.swift
        group: Shared
      - path: ../../src/web/public/pet-claude.webp
        group: Shared
        buildPhase: resources
    dependencies:
      - target: SwiftTerm
      - target: ShareExtension
        embed: true
    settings:
      base:
        PRODUCT_NAME: AISpace
        PRODUCT_BUNDLE_IDENTIFIER: dev.ai-space.ios
        INFOPLIST_FILE: AISpace/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: AISpace/AISpace.entitlements
        CODE_SIGN_STYLE: Automatic
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes: [Info.plist, ShareExtension.entitlements]
      - path: AISpace/Core/ScreenshotRules.swift
      - path: AISpace/Core/SharedCaptureStore.swift
      - path: AISpace/Live/CapturePicture.swift
      - path: AISpace/Live/ShareAccess.swift
      - path: AISpace/Live/SharedCaptureModel.swift
      - path: AISpace/Views/SharedCaptureView.swift
      - path: AISpace/Resources
        includes: ["**/*.strings"]
        buildPhase: resources
      - path: ../../desktop/macos/AISpace/Services/Connection.swift
        group: Shared
      - path: ../../desktop/macos/AISpace/Services/SpaceAPI.swift
        group: Shared
      - path: ../../desktop/macos/AISpace/Services/SpaceModels.swift
        group: Shared
      - path: ../../desktop/macos/AISpace/Services/SpaceCheck.swift
        group: Shared
      - path: ../../desktop/macos/AISpace/Services/ChatImage.swift
        group: Shared
      - path: ../../desktop/macos/AISpace/Services/ChatStream.swift
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ai-space.ios.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
  AISpaceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AISpaceTests]
    dependencies:
      - target: AISpace
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AISpace.app/AISpace
schemes:
  AISpace:
    build:
      targets:
        AISpace: all
        AISpaceTests: [test]
    test:
      targets: [AISpaceTests]
